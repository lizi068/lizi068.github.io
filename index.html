/* ========== 第三幕：乐舞敦煌（重制·寻乐器） ========== */

        .modal-corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(200,150,50,0.6); }
        .modal-corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .modal-corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .modal-corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .modal-corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; color: rgba(255,232,176,0.6); cursor: pointer; transition: all 0.3s ease; background: none; border: none; font-family: inherit; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .modal-close:hover { color: #ffe8b0; background: rgba(255,200,80,0.1); transform: rotate(90deg); }
        .modal-image { width: 120px; height: 120px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; position: relative; }
        .modal-image::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 150px; height: 150px; background: radial-gradient(circle, rgba(255,200,80,0.15) 0%, transparent 60%); border-radius: 50%; }
        .modal-image img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(255,200,80,0.3)); position: relative; z-index: 1; }
        .modal-name { font-size: 1.8rem; letter-spacing: 0.3em; margin-bottom: 16px; font-weight: normal; position: relative; display: inline-block; }
        .modal-name::before, .modal-name::after { content: '❋'; font-size: 0.8rem; color: rgba(200,150,50,0.6); margin: 0 12px; vertical-align: middle; }
        .modal-divider { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,150,50,0.6), transparent); margin: 0 auto 20px; position: relative; }
        .modal-divider::before, .modal-divider::after { content: ''; position: absolute; top: 50%; width: 4px; height: 4px; background: rgba(200,150,50,0.6); border-radius: 50%; transform: translateY(-50%); }
        .modal-divider::before { left: -10px; } .modal-divider::after { right: -10px; }
        .modal-desc { font-size: 15px; line-height: 1.8; color: rgba(220,190,140,0.85); letter-spacing: 0.05em; text-align: left; text-indent: 2em; }
        .modal-origin { margin-top: 16px; font-size: 13px; color: rgba(200,150,50,0.7); letter-spacing: 0.1em; position: relative; padding-top: 12px; }
        .modal-origin::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 30px; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,150,50,0.4), transparent); }
        .modal-audio-btn { margin-top: 24px; padding: 10px 30px; background: linear-gradient(135deg, rgba(255,200,80,0.15) 0%, rgba(200,150,50,0.25) 100%); border: 1px solid rgba(255,200,80,0.5); border-radius: 25px; color: #ffe8b0; font-size: 14px; letter-spacing: 0.2em; cursor: pointer; transition: all 0.3s ease; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
        .modal-audio-btn:hover { background: linear-gradient(135deg, rgba(255,200,80,0.25) 0%, rgba(200,150,50,0.35) 100%); box-shadow: 0 0 15px rgba(255,200,80,0.3); transform: translateY(-2px); }
        .modal-audio-btn.playing { background: linear-gradient(135deg, rgba(255,200,80,0.3) 0%, rgba(200,150,50,0.4) 100%); box-shadow: 0 0 20px rgba(255,200,80,0.4); }
        .modal-audio-btn::before { content: '♪'; font-size: 16px; }
        .modal-audio-btn.playing::before { content: '♫'; animation: notePulse 1s ease-in-out infinite; }
        @keyframes notePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .modal-audio-hint { margin-top: 8px; font-size: 12px; color: rgba(200,150,50,0.5); letter-spacing: 0.1em; }

        /* 响应式 - 全面移动端适配 */
        @media (max-width: 768px) {

        .xu-intro-panel { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); width: min(94%, 47.5vh); }        /* 参考图3 文字简介面板：横贯画面，文字区对齐 y27.8%-60.2%，返回按钮位于框内底部 */
        .xu-intro-back { position: absolute; left: 48%; top: 68.2%; transform: translate(-50%, -50%); height: 5%; cursor: pointer; } /* 参考图3 返回 框414,664,546,700 中心48%,68.2%，位于简介框内底部 */

        /* 序幕音符开关 */
        .xu-music-btn { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; border-radius: 50%; background: rgba(45, 28, 12, 0.55); border: 1px solid rgba(225, 195, 145, 0.65); color: #EAD8AE; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 8; -webkit-tap-highlight-color: transparent; }
        .xu-music-btn.muted { opacity: 0.55; }

        /* ========== 引导页（听音/寻音/奏音/传音） ========== */

    <script>

        // ========== 音效系统 ==========
        const soundEffects = {};
        let ambientAudio = null;
        let currentAmbientScene = null;

        function loadSound(name, src) {
            soundEffects[name] = new Audio(src);
            soundEffects[name].preload = 'auto';
        }

        function playSound(name) {
            if (soundEffects[name]) {
                soundEffects[name].currentTime = 0;
                soundEffects[name].volume = 1;
                const playPromise = soundEffects[name].play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        // 移动端自动播放被阻止，静默处理
                        console.log('音效播放被阻止:', name, err.message);
                    });
                }
            }
        }

        // 场景背景音
        const ambientMusic = {
            opening: 'assets/sound/ambient_desert.mp3',
            second: 'assets/sound/ambient_desert.mp3',
            third: 'assets/sound/ambient_mural.mp3'
        };

        function playAmbient(scene) {
            if (currentAmbientScene === scene) return;
            if (ambientAudio) {
                ambientAudio.pause();
                ambientAudio = null;
            }
            currentAmbientScene = scene;
            if (ambientMusic[scene]) {
                ambientAudio = new Audio(ambientMusic[scene]);
                ambientAudio.loop = (scene !== 'fifth');
                ambientAudio.volume = 0.3;
                ambientAudio.play().catch(() => {});
            }
        }

        function stopAmbient() {
            if (ambientAudio) {
                ambientAudio.pause();
                ambientAudio = null;
                currentAmbientScene = null;
            }
        }

        // 第三幕（乐舞敦煌）专属背景音乐 music.mp3：循环播放 + 右上角音符开关
        var yiMusic = null;
        var yiMusicOn = false;
        function playYiMusic() {
            if (!yiMusic) {
                yiMusic = new Audio('assets/yi/music.mp3');
                yiMusic.loop = true;
                yiMusic.volume = 0.3;
            }
            var p = yiMusic.play();
            if (p !== undefined) p.catch(function(e) { console.log('背景音乐播放失败:', e); });
            yiMusicOn = true;
            updateYiMusicBtn();
        }
        function stopYiMusic() {
            if (yiMusic) { try { yiMusic.pause(); } catch (e) {} }
            yiMusicOn = false;
            updateYiMusicBtn();
        }
        function toggleYiMusic() {
            playSound('click');
            if (yiMusicOn) { stopYiMusic(); } else { playYiMusic(); }
        }
        function updateYiMusicBtn() {
            var b = document.getElementById('yiMusicBtn');
            if (b) b.classList.toggle('off', !yiMusicOn);
        }

        // 预加载音效
        function initSounds() {
            loadSound('click', 'assets/sound/click.mp3');
            loadSound('tile', 'assets/sound/book_open.mp3');
            loadSound('pageFlip', 'assets/sound/page_flip.mp3');
            loadSound('bookOpen', 'assets/sound/book_open.mp3');
            loadSound('musicStart', 'assets/sound/click.mp3');
            loadSound('hover', 'assets/sound/click.mp3');
            loadSound('transition', 'assets/sound/page_flip.mp3');

            // 预加载 click 音效，确保首次点击能播放
            if (soundEffects['click']) {
                soundEffects['click'].load();
                // 尝试静音播放一次以解锁音频上下文（移动端需要）
                soundEffects['click'].volume = 0;
                soundEffects['click'].play().then(() => {
                    soundEffects['click'].pause();
                    soundEffects['click'].volume = 1;
                }).catch(() => {});
            }
        }


        // 开场音乐
        let openingMusic = null;
        let isMusicPlaying = false;
        let musicPlayedOnce = false;

        // 乐器数据
        const instrumentsData = {
            pipa: { name: '琵琶', image: 'assets/第三幕/instrument_pipa.png', audio: 'assets/第三幕/audio/pipa.mp3', desc: '琵琶是敦煌壁画中出现最多的弹拨乐器，被誉为"民乐之王"。琵琶音箱呈半梨形，上装四弦，最早名为"批把"，因演奏时向前弹出曰"批"，向后挑进曰"把"而得名。', origin: '起源于西域，汉代传入中原，隋唐时期达到鼎盛' },
            ruan: { name: '阮', image: 'assets/第三幕/instrument_ruan.png', audio: 'assets/第三幕/audio/ruan.mp3', desc: '阮是一种中国传统弹拨乐器，相传因魏晋名士阮咸善弹此乐器而得名。阮的音色圆润柔和，形似满月，在敦煌壁画中常与其他乐器一同出现，是唐代乐舞中不可或缺的乐器。', origin: '起源于秦汉时期，唐代发展成熟' },
            konghou: { name: '箜篌', image: 'assets/第三幕/instrument_konghou.png', audio: 'assets/第三幕/audio/konghou.mp3', desc: '箜篌是中国古代传统弹拨乐器，分为卧箜篌和竖箜篌两种。敦煌壁画中的箜篌多为竖箜篌，形态优美，音色清澈如流水，是宫廷雅乐和敦煌乐舞中的重要乐器。', origin: '竖箜篌汉代从西域传入，卧箜篌为中国本土乐器' },
            sheng: { name: '笙', image: 'assets/第三幕/instrument_sheng.png', audio: 'assets/第三幕/audio/sheng.mp3', desc: '笙是中国最古老的吹奏乐器之一，属于簧片乐器。笙由多根竹管组成，音色清越、高雅，能演奏和声。在敦煌壁画中，笙常与其他乐器配合演奏，是唐代乐队中的重要成员。', origin: '起源于3000多年前的商代，是世界上最早使用自由簧的乐器' },
            xiao: { name: '箫', image: 'assets/第三幕/instrument_xiao.png', audio: 'assets/第三幕/audio/xiao.mp3', desc: '箫是中国古老的吹奏乐器，分为洞箫和琴箫。箫的音色圆润轻柔，幽静典雅，适合独奏和重奏。在敦煌壁画中，箫常出现在乐舞场景中，是表现清幽意境的重要乐器。', origin: '起源于远古时期，汉代发展成熟' },
            drum: { name: '鼓', image: 'assets/第三幕/instrument_drum.png', audio: 'assets/第三幕/audio/drum.mp3', desc: '鼓是敦煌壁画中最常见的打击乐器，种类繁多，包括羯鼓、腰鼓、答腊鼓等。鼓在乐舞中起着指挥节奏的重要作用，鼓声激昂有力，能带动整个乐舞的气氛。', origin: '鼓的历史悠久，种类丰富，唐代西域鼓乐传入中原' }
        };

        let currentAudio = null;
        let currentInstrument = null;


        // ========== 封面进入：点击"点击音符进入"后播放开场动画 ==========
        function startOpening() {
            playSound('click');
            const cover = document.getElementById('openingCover');
            const skipBtn = document.getElementById('skipBtn');
            const video = document.getElementById('openingVideo');
            if (cover) cover.classList.add('hide');
            if (skipBtn) skipBtn.classList.remove('hidden');
            // 用户未手动操作过音乐时，自动开始循环背景音乐
            if (openingMusic && !musicPlayedOnce && !isMusicPlaying) {
                openingMusic.play().catch(function(e) {
                    console.log('音乐播放失败:', e);
                });
                isMusicPlaying = true;
                musicPlayedOnce = true;
                updateMusicBtn();
            }
            if (video) {
                video.muted = true;
                video.play().catch(function(e) {
                    console.log('视频播放失败:', e);
                    showOpeningEndScene();
                });
            }
        }

        // ========== 场景切换 ==========
        function skipOpening() {
            playSound('click');
            const video = document.getElementById('openingVideo');
            if (video) {
                try { video.pause(); video.currentTime = video.duration || 0; } catch(e) {}
                video.classList.add('fade-out');
            }
            showOpeningEndScene();
        }

        function showOpeningEndScene() {
            const video = document.getElementById('openingVideo');
            const content = document.getElementById('openingContent');
            const skipBtn = document.getElementById('skipBtn');

            if (video) video.classList.add('fade-out');
            if (skipBtn) skipBtn.classList.add('hidden');

            // 直接显示进入画面，跳过洞窟入口
            setTimeout(() => {
                if (content) content.classList.add('show');
            }, 500);
        }

        function enterSecondScene() {
            playSound('click');
            stopOpeningMusic();
            document.getElementById('scene-opening').classList.remove('active');
            document.getElementById('scene-second').classList.add('active');
            createParticles();
            // 显示引导页（听音呼吸），点听音后再播放视频
            showGuide('tingyin');
        }


        // ========== 序幕：循声入窟（原第二幕丝路寻音改写） ==========
        let xuMusic = null;          // 急胡相问背景音乐
        let xuMusicPlaying = false;  // 序幕音乐播放状态
        let prologueToken = 0;       // 序幕流程令牌（防止旧定时器干扰）

        function initPrologue() {
            xuMusic = new Audio('assets/xu/jihuxiangwen.mp3');
            xuMusic.loop = true;
            xuMusic.volume = 0.6;
            xuMusic.addEventListener('error', function() {
                console.log('序幕音乐加载失败');
            });
        }

        function xuReset() {
            prologueToken++;
            if (xuMusic) { xuMusic.pause(); xuMusic.currentTime = 0; }
            xuMusicPlaying = false;
            var v1 = document.getElementById('prologueVideo');
            if (v1) { v1.pause(); v1.currentTime = 0; }
            var v2 = document.getElementById('ganluVideo');
            if (v2) { v2.pause(); v2.currentTime = 0; }
            ['prologueStatic', 'prologueVideoWrap', 'prologueIntro', 'prologueGanlu'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.classList.remove('show');
            });
            var black = document.getElementById('prologueBlack');
            if (black) black.classList.remove('show');
            document.querySelectorAll('.xu-btn').forEach(function(b) {
                b.classList.remove('show');
                b.classList.remove('quick-hide');

            });
            var screen = document.getElementById(id);
            if (screen) screen.classList.add('active');
        }

        // 返回按钮：转场 → 回到第三幕画面H
        function erBackToH() {
            playSound('click');
            erStopBgMusic();
            document.getElementById('scene-er').classList.remove('active');
            document.getElementById('scene-third').classList.add('active');
            yiShowScreen('yiScreenH', true);
            // 恢复第三幕音乐
            playYiMusic();
        }

        // 古音新编
        function erGoGuyin() {
            playSound('click');
            erStopBgMusic(); // 进入详情页停止背景音乐
            erShowScreen('erScreen3a');
        }
        // 一脉西传
        function erGoYimai() {
            playSound('click');
            erStopBgMusic();
            erShowScreen('erScreen3b');
        }
        // 异彩纷呈
        function erGoYicai(idx) {
            playSound('click');
            erStopBgMusic();
            erYicaiState = idx || 0;
            erUpdateYicaiState();
            erShowScreen('erScreen3c');
        }
        function erSwitchYicai(dir) {
            playSound('click');
            erYicaiState = (erYicaiState + dir + 3) % 3;
            erUpdateYicaiState();
        }
        function erUpdateYicaiState() {
            var imgs = ['erImgWuju','erImgYingxiang','erImgYuetuan'];
            var texts = ['erTextWuju','erTextYingxiang','erTextYuetuan'];
            var forms = ['erFormWuju','erFormYingxiang','erFormYuetuan'];
            imgs.forEach(function(id,i){ document.getElementById(id).style.display = i===erYicaiState?'':'none'; });
            texts.forEach(function(id,i){ document.getElementById(id).style.display = i===erYicaiState?'':'none'; });
            forms.forEach(function(id,i){ document.getElementById(id).style.display = i===erYicaiState?'':'none'; });
            // 乐团态显示"重新体验"按钮
            document.getElementById('erChongxinBtn').style.display = erYicaiState===2?'':'none';
            // 乐团态返回按钮位置微调（左移）
            document.getElementById('erBackBtn').style.left = erYicaiState===2?'26%':'50%';
        }

        // 返回三站选择
        function erBackToStations() {
            playSound('click');
            if (erTingAudio) { erTingAudio.pause(); erTingAudio = null; }
            erShowScreen('erScreen2');
            erStartBgMusic();
        }

        // 试听音频
        function erPlayAudio(type) {
            playSound('click');
            if (erTingAudio) erTingAudio.pause();
            erTingAudio = new Audio(type === 'mukamu' ? 'assets/er/mukamu.mp3' : 'assets/er/xinbian.mp3');
            erTingAudio.play().catch(function(e){ console.log('试听播放失败:', e); });
        }

        // 重新体验：回到开场画面
        /* ========== 引导页逻辑 ========== */
        var guideNextStep = null; // 记录用户从哪个节点进来的引导页
        function showGuide(nextStep) {
            guideNextStep = nextStep;
            // 清除所有呼吸动画
            ['guideTingyin', 'guideXunyin', 'guideZouyin', 'guideChuanyin'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.classList.remove('breathing');
            });
            // 给"理论上下一环节"按钮加呼吸动画
            var breathId = { tingyin: 'guideTingyin', xunyin: 'guideXunyin', zouyin: 'guideZouyin', chuanyin: 'guideChuanyin' }[nextStep];
            if (breathId) {
                var b = document.getElementById(breathId);
                if (b) b.classList.add('breathing');
            }
            var ov = document.getElementById('guideOverlay');
            if (ov) ov.classList.add('show');
        }
        function hideGuide() {
            var ov = document.getElementById('guideOverlay');
            if (ov) ov.classList.remove('show');
            ['guideTingyin', 'guideXunyin', 'guideZouyin', 'guideChuanyin'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.classList.remove('breathing');
            });
        }
        function guideGo(step) {
            playSound('click');
            hideGuide();
            // 先停所有背景音乐，避免同时播放
            stopYiMusic();
            stopAmbient();
            if (erBgMusic) { try { erBgMusic.pause(); } catch(e){} erBgMusicPlaying = false; }
            if (xuMusic) { try { xuMusic.pause(); } catch(e){} xuMusicPlaying = false; }
            // 所有按钮都直接跳转到对应画面
            if (step === 'tingyin') {
                // 听音 → 上前聆听静态封面
                xuReset();
                document.getElementById('scene-er').classList.remove('active');
                document.getElementById('scene-third').classList.remove('active');
                document.getElementById('scene-second').classList.add('active');
                startPrologue();
            } else if (step === 'xunyin') {
                // 寻音 → 播放甘露视频（ganlu.mp4）
                xuReset();
                document.getElementById('scene-er').classList.remove('active');
                document.getElementById('scene-third').classList.remove('active');
                document.getElementById('scene-second').classList.add('active');
                xuDoContinue();
            } else if (step === 'zouyin') {
                // 奏音 → 先播放视频，再跳转选择乐器画面
                document.getElementById('scene-er').classList.remove('active');
                document.getElementById('scene-second').classList.remove('active');
                document.getElementById('scene-third').classList.add('active');
                // 显示奏音视频层并播放
                var zyWrap = document.getElementById('zouyinVideoWrap');
                if (zyWrap) zyWrap.classList.add('show');
                var zyVideo = document.getElementById('zouyinVideo');
                if (zyVideo) {
                    zyVideo.currentTime = 0;
                    zyVideo.play().catch(function(e) {
                        console.log('奏音视频有声播放失败，降级静音:', e);
                        zyVideo.muted = true;
                        zyVideo.play().catch(function(e2) {
                            console.log('奏音视频静音播放也失败:', e2);
                            if (zyWrap) zyWrap.classList.remove('show');
                            yiDoGoSelect();
                        });
                    });
                }
            } else if (step === 'chuanyin') {
                // 传音 → 先播放视频，再跳转三站画面
                stopYiMusic();
                stopAmbient();
                document.getElementById('scene-second').classList.remove('active');
                document.getElementById('scene-third').classList.remove('active');
                document.getElementById('scene-er').classList.add('active');
                // 显示传音视频层并播放
                var cyWrap = document.getElementById('chuanyinVideoWrap');
                if (cyWrap) cyWrap.classList.add('show');
                var cyVideo = document.getElementById('chuanyinVideo');
                if (cyVideo) {
                    cyVideo.currentTime = 0;
                    cyVideo.play().catch(function(e) {
                        console.log('传音视频有声播放失败，降级静音:', e);
                        cyVideo.muted = true;
                        cyVideo.play().catch(function(e2) {
                            console.log('传音视频静音播放也失败:', e2);
                            if (cyWrap) cyWrap.classList.remove('show');
                            yiXunshengQiannianGoDirect();
                        });
                    });
                }
            }
        }

        function erRestart() {
            playSound('click');
            // 停止所有第二幕音频
            if (erBgMusic) erBgMusic.pause();
            erBgMusicPlaying = false;
            if (erTingAudio) { erTingAudio.pause(); erTingAudio = null; }
            // 停止第三幕音乐
            try { stopYiMusic(); } catch(e) {}
            try { stopAmbient(); } catch(e) {}
            // 停止序幕音乐
            try { if (xuMusic) xuMusic.pause(); xuMusicPlaying = false; } catch(e) {}
            // 隐藏所有 scene
            document.querySelectorAll('.scene').forEach(function(s){ s.classList.remove('active'); });
            // 显示开场
            document.getElementById('scene-opening').classList.add('active');
            // 重置开场状态：显示封面、隐藏洞窟入口
            var cover = document.getElementById('openingCover');
            if (cover) cover.style.display = '';
            var cave = document.getElementById('openingCaveEntrance');
            if (cave) cave.style.display = '';
            // 重置开场视频
            var ov = document.getElementById('openingVideo');
            if (ov) { try { ov.pause(); ov.currentTime = 0; } catch(e) {} }
            // 重置序幕状态（回到静态封面）
            var pvWrap = document.getElementById('prologueVideoWrap');
            if (pvWrap) pvWrap.classList.remove('show');
            var ganlu = document.getElementById('prologueGanlu');
            if (ganlu) ganlu.classList.remove('show');
            var pv = document.getElementById('prologueVideo');
            if (pv) { try { pv.pause(); pv.currentTime = 0; } catch(e) {} }
            // 重置第三幕到画面A
            try { yiShowScreen('yiScreenA', true); } catch(e) {}
            // 重置音符按钮
            updateErMusicBtn();
        }

        // 简介弹窗打开时，点击画面任意处关闭
        document.getElementById('scene-third').addEventListener('click', function(e) {
            if (!yiPopupOpen) return;
            if (e.target && e.target.closest && (e.target.closest('.yi-mural-inst') || e.target.closest('.yi-btn'))) return;
            yiClosePopup();
        });

        // ========== 粒子效果 ==========
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container || container.children.length > 0) return;
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                const sizeType = Math.random();
                if (sizeType < 0.2) particle.className = 'particle large';
                else if (sizeType < 0.6) particle.className = 'particle';
                else particle.className = 'particle small';

                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-10px';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(particle);
            }
        }


        function createOpeningParticles() {
            const container = document.getElementById('openingParticles');
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'opening-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-10px';
                const size = Math.random() * 2 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(particle);
            }
        }

        // ========== 开场音乐控制 ==========
        function initOpeningMusic() {
            openingMusic = new Audio('assets/begin.mp3');
            openingMusic.loop = true;
            openingMusic.volume = 0.6;

            openingMusic.addEventListener('ended', function() {
                isMusicPlaying = false;
                updateMusicBtn();
            });

            openingMusic.addEventListener('error', function() {
                console.log('开场音乐加载失败');
                document.getElementById('musicToggleBtn').style.display = 'none';
            });
        }

        function toggleOpeningMusic() {
            playSound('click');
            if (!openingMusic) return;

            if (isMusicPlaying) {
                openingMusic.pause();
                isMusicPlaying = false;
            } else {
                // 如果已经播放过一次且结束了，重新加载
                if (openingMusic.ended) {
                    openingMusic.currentTime = 0;
                }
                openingMusic.play().catch(function(e) {
                    console.log('音乐播放失败:', e);
                });
                isMusicPlaying = true;
                musicPlayedOnce = true;
            }
            updateMusicBtn();
        }

        function updateMusicBtn() {
            const btn = document.getElementById('musicToggleBtn');
            const icon = document.getElementById('musicIcon');
            if (isMusicPlaying) {
                btn.classList.add('playing');
                btn.classList.remove('muted');
                icon.textContent = '♫';
            } else {
                btn.classList.remove('playing');
                btn.classList.add('muted');
                icon.textContent = '♪';
            }
        }

        function stopOpeningMusic() {
            if (openingMusic) {
                openingMusic.pause();
                openingMusic.currentTime = 0;
                isMusicPlaying = false;
                updateMusicBtn();
            }
        }

        // ========== 视频播放结束处理 ==========
        document.getElementById('openingVideo').addEventListener('ended', function() {
            showOpeningEndScene();
        });

        // 视频加载超时保护：如果3秒后视频仍未播放，直接显示结束画面
        setTimeout(function() {
            const video = document.getElementById('openingVideo');
            const cover = document.getElementById('openingCover');
            const content = document.getElementById('openingContent');
            // 仅当封面已隐藏（用户已点击进入）时才做超时兜底
            if (cover && !cover.classList.contains('hide')) return;
            if (video && content && !content.classList.contains('show')) {
                if (video.readyState < 2 || video.paused || video.ended) {
                    console.log('视频未正常播放，切换到静态开场');
                    showOpeningEndScene();
                }
            }
        }, 3500);

        document.getElementById('openingVideo').addEventListener('error', function() {
            console.log('视频加载失败，使用静态开场');
            const cover = document.getElementById('openingCover');
            // 封面阶段不抢显示，等用户点击进入时由 play() 兜底
            if (cover && !cover.classList.contains('hide')) return;
            showOpeningEndScene();
        });

        // ========== 预加载 ==========
        function preloadImages() {
            const images = [
                'assets/yi/beijingtu.png', 'assets/yi/juanzhou1.png', 'assets/yi/huhan.png', 'assets/yi/xunzhaowz.png',
                'assets/yi/juanzhou.png', 'assets/yi/beibi.jpg', 'assets/yi/wenzi.png', 'assets/yi/ju1.png',
                'assets/yi/bili1.png', 'assets/yi/shukonghou1.png', 'assets/yi/dalagu1.png', 'assets/yi/jiegu1.png',
                'assets/yi/bili2.png', 'assets/yi/shukonghou2.png', 'assets/yi/dalagu2.png', 'assets/yi/jiegu2.png',
                'assets/yi/suo.png', 'assets/yi/bilijs.png', 'assets/yi/shukonghoujs.png', 'assets/yi/dalagujs.png', 'assets/yi/jiegujs.png',
                'assets/yi/jianjie-juanzhou.png', 'assets/yi/220chatu.png', 'assets/yi/220jianjie.png', 'assets/yi/xuanze-beijing.png',
                'assets/yi/gongxiw.png', 'assets/yi/yueqiyanzou.png', 'assets/yi/zailaiyici.png'
            ];
            images.forEach(src => { const img = new Image(); img.src = src; });
        }

        window.addEventListener('load', function() {
            preloadImages();
            createOpeningParticles();
            initOpeningMusic();
            initSounds();
            initPrologue();
            // 显示音频解锁提示（移动端需要用户交互才能播放音频）
            setTimeout(function() {
                const hint = document.getElementById('audioUnlockHint');
                if (hint) hint.style.opacity = '1';
            }, 2000);
        });

        // 首次点击页面任意位置解锁音频上下文
        let audioContextUnlocked = false;
        document.addEventListener('click', function unlockAudio() {
            if (audioContextUnlocked) return;
            audioContextUnlocked = true;

            // 播放一次静音 click 来解锁音频
            if (soundEffects['click']) {
                soundEffects['click'].volume = 0.01;
                soundEffects['click'].play().then(() => {
                    soundEffects['click'].pause();
                    soundEffects['click'].volume = 1;
                }).catch(() => {});
            }

            // 隐藏提示
            const hint = document.getElementById('audioUnlockHint');
            if (hint) hint.style.opacity = '0';

            document.removeEventListener('click', unlockAudio);
        }, { once: false });
    </script>
    <!-- ========== 引导页 overlay ========== -->
    <div class="guide-overlay" id="guideOverlay">
        <img class="guide-bg" src="assets/beijing-huanjie.png" alt="">
        <img class="guide-btn guide-tingyin" id="guideTingyin" src="assets/tingyin.png" alt="听音" onclick="guideGo('tingyin')">
        <img class="guide-arrow guide-jiantou1" src="assets/jiantou1.png" alt="">
        <img class="guide-btn guide-xunyin" id="guideXunyin" src="assets/xunyin.png" alt="寻音" onclick="guideGo('xunyin')">
        <img class="guide-arrow guide-jiantou2" src="assets/jiantou2.png" alt="">
        <img class="guide-btn guide-zouyin" id="guideZouyin" src="assets/zouyin.png" alt="奏音" onclick="guideGo('zouyin')">
        <img class="guide-arrow guide-jiantou3" src="assets/jiantou3.png" alt="">
        <img class="guide-btn guide-chuanyin" id="guideChuanyin" src="assets/chuanyin.png" alt="传音" onclick="guideGo('chuanyin')">
    </div>
